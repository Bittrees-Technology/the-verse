services:
  simulation-worker:
    build:
      context: ../..
      dockerfile: infra/containers/simulation-worker.Dockerfile
    ports:
      - "7777:7777"
    volumes:
      - verse-universe:/home/verse/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  verse-universe:
