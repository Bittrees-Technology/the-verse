[workspace]
resolver = "2"
members = [
  "crates/verse-protocol",
  "crates/verse-interest-verifier",
  "crates/verse-godot-interest-adapter",
  "crates/verse-physics",
  "crates/verse-simulation",
  "services/simulation-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["The Verse contributors"]
repository = "https://github.com/Bittrees-Technology/the-verse"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
fs2 = "0.4"
godot = { version = "=0.5.4", features = ["api-4-7"] }
http = "1.3"
joltc-sys = { git = "https://github.com/SecondHalfGames/jolt-rust", rev = "72ac0cb1acc2037c72dc29865da6f52a5483dadc", features = ["double-precision"] }
parking_lot = "0.12"
proptest = "1.7"
rolt = { git = "https://github.com/SecondHalfGames/jolt-rust", rev = "72ac0cb1acc2037c72dc29865da6f52a5483dadc", features = ["double-precision"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
