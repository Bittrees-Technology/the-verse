[package]
name = "verse-physics"
description = "Safe authoritative Jolt physics adapter for The Verse"
license = "AGPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
joltc-sys.workspace = true
rolt.workspace = true
thiserror.workspace = true

# This crate is the sole project-owned unsafe FFI boundary for Jolt. It does
# not inherit the workspace's `unsafe_code = forbid`; every unsafe operation is
# confined to `src/ffi.rs` and documented there.
[lints.rust]
unsafe_code = "allow"
missing_debug_implementations = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
